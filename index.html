<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Element Blocks</title>
<meta name="description" content="Element Blocks — a mobile-first 1010!-style endless block puzzle. Drag nature pieces onto a 10×10 grid, fill rows and columns to clear, chase your high score.">
<link rel="icon" href="assets/icon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="app" aria-label="Element Blocks game">
  <header>
    <h1>🌿 Element Blocks</h1>
    <div class="header-actions">
      <button id="sound-btn" aria-pressed="true" aria-label="Mute sound" title="Toggle sound">🔊</button>
      <button id="new-btn" title="New game">↻ New</button>
    </div>
  </header>

  <section id="hud" aria-live="polite">
    <div class="hud-item"><span class="label">Score</span><span id="hud-score">0</span></div>
    <div class="hud-item"><span class="label">Best</span><span id="hud-best">0</span></div>
    <div class="hud-item"><span class="label">Stars</span><span id="hud-stars">★ 0</span></div>
    <div class="hud-item" id="hud-combo-wrap"><span class="label">Combo</span><span id="hud-combo">×1</span></div>
  </section>

  <div id="grid" role="grid" aria-label="10 by 10 game grid"></div>
  <p id="cursor-hint" aria-live="polite">Select a piece, then tap the grid — or use 1–3 + arrows + Enter.</p>

  <section id="tray" aria-label="Piece tray"></section>

  <section id="powerups" aria-label="Power-ups">
    <button id="pu-hammer" aria-pressed="false">🔨 Hammer <small>5★</small><span class="free" id="hammer-free">FREE</span></button>
    <button id="pu-bomb" aria-pressed="false">💣 Bomb <small>10★</small></button>
    <button id="pu-shuffle" aria-pressed="false">🔀 Shuffle <small>3★</small></button>
  </section>
  <p id="powerup-hint" aria-live="polite"></p>

  <div id="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="gameover-title">
    <div class="card">
      <h2 id="gameover-title">Game over</h2>
      <p>Score <strong id="final-score">0</strong> · Best <strong id="final-best">0</strong></p>
      <button id="again-btn">Play again</button>
    </div>
  </div>
</main>
<div id="drag-ghost" hidden aria-hidden="true"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
